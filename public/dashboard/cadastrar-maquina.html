                        <div class="box-cadastrar">
                            <h2>CADASTRO DE MÁQUINA</h2>

                            <form class="form-maquina" onsubmit="cadastrarMaquina(event)">
                                <div class="campo-maquina"></div>
                                <label for="nome-maquina">Nome</label>
                                <input type="text" id="nome-maquina" name="nome" placeholder="PROD-WEB-01">

                                <input type="text" id="host-maquina" placeholder="SERVER-001">

                                <label for="mac-maquina">Mac Adress</label>

                                <div class="campo-maquina"></div>

    <div id="modalNotificacoes">
        <div class="modal-content">
            <div id="alertasContainer"></div>
            <button id="btnFecharModal">Fechar</button>
        </div>
    </div>





    <div id="modalErro" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Erro</h3>
                <span class="modal-close" onclick="fecharModal()">&times;</span>
            </div>
            <div class="modal-body">
                <p id="modalErroMessage"></p>
            </div>
            <div class="modal-footer">
                <button class="btn-fechar" onclick="fecharModal()">Fechar</button>
            </div>
        </div>
    </div>


    <script>

        function mostrarErro(mensagem) {
            const modal = document.getElementById('modalErro');
            const mensagemElement = document.getElementById('modalErroMessage');
            mensagemElement.textContent = mensagem;
            modal.style.display = 'block';
        }

        function fecharModal() {
            const modal = document.getElementById('modalErro');
            modal.style.display = 'none';
        }

        window.onclick = function (event) {
            const modal = document.getElementById('modalErro');
            if (event.target == modal) {
                modal.style.display = 'none';
            }
        }

        async function cadastrarMaquina(event) {
            event.preventDefault();

            const nome = document.getElementById('nome-maquina').value.trim();
            const hostname = document.getElementById('host-maquina').value.trim();
            const mac = document.getElementById('mac-maquina').value.trim();
            const ip = document.getElementById('ip-maquina').value.trim();

            if (!nome || !hostname || !mac || !ip) {
                mostrarErro('Por favor, preencha todos os campos.');
                return;
            }

            const macRegex = /^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$/;
            if (!macRegex.test(mac)) {
                mostrarErro('Formato de MAC address inválido. Use o formato XX:XX:XX:XX:XX:XX');
                return;
            }

            const hostNumerico = javaStringHashCodeNonNegative(hostname);
            const fkEmpresa = sessionStorage.getItem("FK_EMPRESA");

            try {
                const response = await fetch(`/usuarios/cadastrarMaquina`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identificador: nome, hostNumerico, mac, ip, fkEmpresa }),
                });

                if (!response.ok) throw new Error('Erro ao cadastrar máquina');

                await cadastrarComponente(hostNumerico);
                window.location.href = 'dashboard-alto.html';
            } catch (error) {
                mostrarErro('Erro ao cadastrar máquina: ' + error.message);
            }
        }

        async function cadastrarComponente(hostNumerico) {
            try {
                const response = await fetch(`/usuarios/cadastrarComponentes`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ hostNumerico }),
                });
                if (!response.ok) throw new Error('Erro ao cadastrar Componente');
            } catch (error) {
                console.error(error);
                mostrarErro('Erro ao cadastrar componente: ' + error.message);
            }
        }


        function javaStringHashCodeNonNegative(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) {
                h = Math.imul(31, h) + s.charCodeAt(i);
                h |= 0;
            }
            return h & 0x7FFFFFFF; // equivalente a conversão do JAVA
        }




        document.addEventListener("DOMContentLoaded", () => {

            const btnNotificacao = document.querySelector('.btn-notificacao');
            const modal = document.getElementById('modalNotificacoes');
            const btnFecharModal = document.getElementById('btnFecharModal');
            const alertasContainer = document.getElementById('alertasContainer');

            if (!btnNotificacao || !modal || !btnFecharModal || !alertasContainer) {
                console.error("Elementos de alerta/maquinas não encontrados:", {
                    btnNotificacao, modal, btnFecharModal, alertasContainer
                });
                return;
            }


            function formatarData(iso) {
                if (!iso) return "—";
                const d = new Date(iso);
                if (isNaN(d)) return "—";
                return d.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
            }
            async function carregarAlertas() {
                alertasContainer.innerHTML = "<p class='loading'>Carregando alertas...</p>";

                try {
                    const resposta = await fetch("/usuarios/puxarAlerta");
                    if (!resposta.ok) throw new Error("Erro ao buscar alertas do servidor.");

                    const alertas = await resposta.json();
                    alertasContainer.innerHTML = "";

                    if (alertas.length == 0) {
                        alertasContainer.innerHTML = "<p class='text-muted text-center'>Nenhum alerta encontrado.</p>";
                        return;
                    }

                    alertas.forEach(alerta => {
                        let tipoClasse = "";
                        switch (alerta.estado) {
                            case "CRITICO":
                                tipoClasse = "danger";
                                break;
                            case "ALERTA":
                                tipoClasse = "warning";
                                break;
                            case "NORMAL":
                                tipoClasse = "success";
                                break;
                            default:
                                tipoClasse = "success";
                        }

                        const dataFormatada = new Date(alerta.dtHora).toLocaleString("pt-BR");


                        const div = document.createElement("div");
                        div.className = `alerta-item ${tipoClasse}`;
                        div.innerHTML = `
              <strong>Identificador da máquina:</strong> <small>${alerta.identificador || "Desconhecida"}</small><br>
              <strong>${alerta.componenteNome || "Componente"}:</strong> ${alerta.captura || "Sem dados."}<br>
              <strong>Estado:</strong> <small>${alerta.estado || "DESCONHECIDO"}</small><br>
              <small>${new Date(alerta.dtHora).toLocaleString("pt-BR")}</small>
          `;

                        alertasContainer.appendChild(div);
                    });
                } catch (error) {
                    console.error("Erro ao carregar alertas:", error);
                    alertasContainer.innerHTML = `<p class="text-danger text-center">Erro ao carregar alertas.</p>`;
                }
            }

            btnNotificacao.addEventListener("click", () => {
                console.log("Clicou no botão de notificação");
                modal.classList.add("active");
                carregarAlertas();
            });
            btnFecharModal.addEventListener("click", () => modal.classList.remove("active"));
            modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("active"); });
        });


    </script>

</body>
