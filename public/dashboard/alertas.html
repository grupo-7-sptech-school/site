<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas - SolarData</title>
  <!-- <link rel="stylesheet" href="./../css/dashboards.css"> -->
  <link rel="stylesheet" href="./../css/alertas.css">
  <link rel="stylesheet" href="../css/cabecalho3.css">
  <link rel="stylesheet" href="./../css/modal.css">

  <!-- Script -->
  <script src="../js/sessao.js"></script>
  <script src="./../js/alerta.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!--FONT AWESOME-->
  <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>

  <!-- Links -->
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- ======= CONTAINER PRINCIPAL ======= -->

  <!-- Cabeçalho -->
  <div class="total-dash">
    <div class="dashboard-bg">

      <!-- ==== SIDEBAR LATERAL ==== -->
      <aside class="dashboard-sidebar">
        <div class="dashboard-logo"></div>

        <nav class="dashboard-sidebar-btns">
          <a href="alertas.html" class="dashboard-sidebar-btn">
            <div class="icon-alert"></div>
            <h3>Alertas</h3>
          </a>
          <a href="contateste.html" class="dashboard-sidebar-btn">
            <div class="icon-user"></div>
            <h3>Conta</h3>
          </a>
          <a href="dashboard-alto.html" class="dashboard-sidebar-btn">
            <div class="icon-dashboard"></div>
            <h3>Painel de <br> Controle</h3>
          </a>
          <a href="suporte.html" class="dashboard-sidebar-btn">
            <div class="icon-support"></div>
            <h3>Suporte</h3>
          </a>
        </nav>

        <a href=".././index.html" class="dashboard-logout">
          <div class="icon-logout"></div>
          <h3>Logout</h3>
        </a>
      </aside>

      <!-- ==== ÁREA PRINCIPAL (DIREITA) ==== -->
      <section class="dashboard-low-right-side">

        <!-- ===== BARRA SUPERIOR ===== -->
        <header class="dashboard-topbar">
          <a href="alertas.html" class="btn-voltar">Alertas - SolarData</a>
          <div class="btns-topbar">
            <!-- <a href="relatorios.html" class="btn-gerar-relatorio">
            Gerar relatório
            </a> -->
            <!-- <div class="btn-padrao">
            <button class="btn-notificacao"></button> -->
            <a href="contateste.html">
              <img id="fotoTopo" src="/assets/icon/icon-user.png"
                style="width:60px;height:60px;border-radius:50%;object-fit:cover;">
            </a>
            <!-- </div> -->
          </div>
        </header>


        <!-- ===== CONTEÚDO PRINCIPAL ===== -->
        <main class="conteudo-principal">

          <!-- Título e subtítulo -->


          <!-- Área de filtro -->
          <div class="filtro-area">
            <label for="selectMaquina" class="filtro-label">Filtrar alertas:</label>
            <select id="selectMaquina" class="filtro-select">
              <option value="all">Todos os alertas</option>
            </select>
            <input type="text" id="buscaAlertas" class="filtro-busca" placeholder="Buscar por nome da máquina..."
              aria-label="Buscar alerta">

            <span id="total-count" class="badge">0 alertas</span>
          </div>

          <!-- Tabela de alertas -->
          <div class="tabela-wrap">
            <table class="table-alertas" id="tabelaAlertas">
              <thead>
                <tr>
                  <th>Data / Hora</th>
                  <th>Máquina</th>
                  <th>Tipo de Alerta</th>
                  <th>Prioridade</th>
                  <th>Descrição</th>
                </tr>
              </thead>
              <tbody>
                <!-- Linhas inseridas via JS -->
              </tbody>
            </table>
          </div>
        </main>
      </section>
    </div>
  </div>
  <div id="modalNotificacoes">
    <div class="modal-content">
      <div id="alertasContainer"></div>
      <button id="btnFecharModal">Fechar</button>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async function () {
      const tabela = document.querySelector("#tabelaAlertas tbody");
      const selectMaquina = document.getElementById("selectMaquina");
      const totalAlertas = document.getElementById("total-count");

      try {
        const resposta = await fetch("/usuarios/puxarTodosAlertas");
        if (!resposta.ok) {
          throw new Error("Erro ao buscar alertas");
        }

        const alertas = await resposta.json();

        if (!alertas || alertas.length == 0) {
          tabela.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Nenhum alerta encontrado.</td></tr>";
          totalAlertas.textContent = "0 alertas";
          return;
        }


        const maquinas = [];
        for (let i = 0; i < alertas.length; i++) {
          const estadoAlerta = alertas[i].prioridade;
          if (!maquinas.includes(estadoAlerta)) {
            maquinas.push(estadoAlerta);
            const option = document.createElement("option");
            option.value = estadoAlerta;
            option.textContent = estadoAlerta;
            selectMaquina.appendChild(option);
          }
        }


        function mostrarTabela(lista) {
          tabela.innerHTML = "";
          for (var i = 0; i < lista.length; i++) {

            var alerta = lista[i];
            var prioridadeAlerta = "";

            if (alerta.prioridade == "Crítico") {
              prioridadeAlerta = "prioridade-alta";
            } else if (alerta.prioridade == "Preventivo") {
              prioridadeAlerta = "prioridade-media";
            } else {
              prioridadeAlerta = "prioridade-baixa";
            }

            const linha = document.createElement("tr");
            linha.innerHTML =
              "<td>" + alerta.dataHora + "</td>" +
              "<td>" + alerta.maquina + "</td>" +
              "<td>" + alerta.tipoAlerta + "</td>" +
              "<td><span class='" + prioridadeAlerta + "'>" + alerta.prioridade + "</span></td>" +
              "<td>" + alerta.descricao + "</td>";;

            tabela.appendChild(linha);
          }
          totalAlertas.textContent = lista.length + " alertas";
        }


        mostrarTabela(alertas);
        const inputBusca = document.getElementById("buscaAlertas");

        selectMaquina.addEventListener("change", function () {
          const filtro = selectMaquina.value;
          const filtrados = [];

          for (let i = 0; i < alertas.length; i++) {
            if (filtro == "all" || alertas[i].prioridade == filtro) {
              filtrados.push(alertas[i]);
            }
          }
          mostrarTabela(filtrados);
        });

        inputBusca.addEventListener("input", function () {
          var nomeBuscado = inputBusca.value.toLowerCase();
          var filtrados = [];

          for (let i = 0; i < alertas.length; i++) {
            const nomeMaquina = alertas[i].maquina.toLowerCase();
            if (nomeMaquina.indexOf(nomeBuscado) === 0 || nomeMaquina.includes(" " + nomeBuscado)) {
              filtrados.push(alertas[i]);
            }
          }
          mostrarTabela(filtrados);
        });

      } catch (erro) {
        console.error("Erro");
      }
    });

  </script>
</body>

</html>
