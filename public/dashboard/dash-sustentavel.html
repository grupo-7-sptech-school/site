<script>

  let periodoSelecionado = "dia";

  function trocarPeriodo() {
    periodoSelecionado = document.getElementById("filtroPeriodo").value;
    carregarKPIS();
    carregarConsumoMensal();
    emissaoPoluentes();
    MaiorConsumo();

  }

  function trocarMaquina() {
    maquinaSelecionada = document.getElementById("filtroMaquina").value;
    atualizarPonteiro();
  }

  var valorEmissaoCO2 = 0.015;

  function trocarFonte() {
    if (document.getElementById("filtroMatriz").value == "Carvao") {
      valorEmissaoCO2 = 1;

    } else if (document.getElementById("filtroMatriz").value == "Gas") {
      valorEmissaoCO2 = 0.49;
    } else if (document.getElementById("filtroMatriz").value == "Nuclear") {
      valorEmissaoCO2 = 0.012;
    } else {
      valorEmissaoCO2 = 0.015;

    }
    carregarKPIS();
    emissaoPoluentes();
  }

  carregarKPIS();
  async function carregarKPIS() {
    const idEmpresa = sessionStorage.FK_EMPRESA;
    const periodo = document.getElementById("filtroPeriodo").value.toLowerCase();

    try {
      const consumo = await fetch(`/sustentabilidade/total/${idEmpresa}/${periodo}`)
        .then(r => r.json());
      const potencia = await fetch(`/sustentabilidade/potencia/${idEmpresa}/${periodo}`)
        .then(r => r.json());
      const nome = await fetch(`/sustentabilidade/nomeMaquina/${idEmpresa}/${periodo}`)
        .then(r => r.json());
      const resposta = await fetch(`/sustentabilidade/kpis/${idEmpresa}/${periodo}`)
        .then(r => r.json());


      if (!resposta || resposta.length === 0) {
        console.warn("Nenhum dado encontrado para o período selecionado.");
        return;
      }

      const dado = resposta[0];


      document.getElementById("kpiConsumoDia").textContent = (consumo[0].total_consumo_wh) + " Wh";
      document.getElementById("kpiCO2").textContent = `${(consumo[0].total_consumo_wh * valorEmissaoCO2).toFixed(2) + " g/Wh"}`
      document.getElementById("kpiMaiorPotencia").textContent = `${potencia[0].potencia_maxima} W`;
      document.getElementById("kpiNomeMaquina").textContent = `${nome[0].identificador}`;

    } catch (erro) {
      console.error("Erro ao carregar KPIs:", erro);
      document.getElementById("kpiConsumoDia").textContent = "-";
      document.getElementById("kpiCO2").textContent = "-";
      document.getElementById("kpiMaiorPotencia").textContent = "-";
      document.getElementById("kpiNomeMaquina").textContent = "-";
    }
  }



  // Gráfico Consumo Mensal
  const ctx = document.getElementById('graficoConsumoEnergia');

  let graficoConsumoEnergia = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: [],
      datasets: [{
        label: 'Consumo (kWh)',
        data: [],
        backgroundColor: 'rgba(54, 162, 235, 0.5)',
        borderColor: 'rgba(54, 162, 235, 1)',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: { beginAtZero: true }
      }
    }
  });


  carregarConsumoMensal();
  setInterval(carregarConsumoMensal, 60000);

  async function carregarConsumoMensal() {
    const idEmpresa = sessionStorage.FK_EMPRESA;
    const periodo = document.getElementById("filtroPeriodo").value.toLowerCase();

    try {
      const resposta = await fetch(`/sustentabilidade/consumo/${idEmpresa}/${periodo}`);
      const dados = await resposta.json();

      const labels = dados.map(item => item.periodo);
      const valores = dados.map(item => item.consumo);

      graficoConsumoEnergia.data.labels = labels;
      graficoConsumoEnergia.data.datasets[0].data = valores;
      graficoConsumoEnergia.update();

      console.log("Gráfico atualizado:", dados);

    } catch (erro) {
      console.error("Erro ao carregar gráfico:", erro);
    }
  }

  // Gráfico Poluentes
  const ctxLinha = document.getElementById('graficoPoluentes');

  const graficoPoluentes = new Chart(ctxLinha, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {
          label: 'CO₂ (ppm)',
          data: [],
          borderColor: 'rgba(255, 99, 132, 1)',
          tension: 0.2
        },
      ]
    },
    options: {
      responsive: true,
      scales: {
        y: { beginAtZero: false }
      }
    }
  });


  emissaoPoluentes();
  setInterval(emissaoPoluentes, 60000);

  async function emissaoPoluentes() {
    const idEmpresa = sessionStorage.FK_EMPRESA;
    const periodo = document.getElementById("filtroPeriodo").value.toLowerCase();

    if (!idEmpresa) {
      console.error("ID da empresa não encontrado no sessionStorage");
      return;
    }

    try {
      const resposta = await fetch(`/sustentabilidade/consumo/${idEmpresa}/${periodo}`);

      if (!resposta.ok) throw new Error("Erro na API Emissão");

      const dados = await resposta.json();
      console.log("Dados recebidos:", dados);

      const labels = dados.map(item => item.periodo);
      const valores = dados.map(item => item.consumo);

      const valoresCO2 = dados.map(item => item.consumo);
      const valoresNOx = dados.map(item => item.consumo);
      const valoresSO2 = dados.map(item => item.consumo);

      graficoPoluentes.data.labels = labels;
      graficoPoluentes.data.datasets[0].data = valoresCO2.map(v => v * valorEmissaoCO2);
      graficoPoluentes.update();

      console.log("Gráfico atualizado!");

    } catch (erro) {
      console.error("Erro ao atualizar gráfico:", erro);
    }
  }

  // Gráficos Maiores Consumos
  const ctxAtual = document.getElementById("consumoEmTempoReal");

  let consumoEmTempoReal = new Chart(ctxAtual, {
    type: "bar",
    data: {
      labels: [],
      datasets: [{
        label: "Consumo médio (Watts)",
        data: [],
        backgroundColor: "rgba(255, 99, 132, 0.5)",
        borderColor: "rgba(255, 99, 132, 1)",
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });

  const fkTipoUsuario = sessionStorage.getItem("FK_TIPO_USUARIO");
  const listaMaquinas = document.getElementById('lista-maquinas');


  MaiorConsumo()

  // Gráfico Ranking Consumo
  async function MaiorConsumo() {
    const idEmpresa = sessionStorage.FK_EMPRESA;
    const periodo = document.getElementById("filtroPeriodo").value.toLowerCase();
    const tbody = document.getElementById("lista-maquinas");
    tbody.innerHTML = "";

    try {

      const resposta = await fetch(`/sustentabilidade/maior/${idEmpresa}/${periodo}`);
      const data = await resposta.json();

      console.log("Dados do Ranking:", data);

      if (!data || data.length === 0) {
        tbody.innerHTML = `<tr>
                <td colspan="4" style="text-align:center;">Nenhum dado encontrado</td>
            </tr>`;
        return;
      }

      data.forEach(item => {
        tbody.innerHTML += `
                <tr>
                    <td>${item.identificador}</td>
                    <td>${item.total_consumo_wh}</td>
                    <td>${item.hostName ?? '-'}</td>
                    <td>${item.ultima_captura ?? '-'}</td>
                </tr>`;
      });

    } catch (erro) {
      console.error("Erro no Ranking:", erro);

      tbody.innerHTML = `<tr>
            <td colspan="4" style="text-align:center;color:red;">Erro ao carregar dados</td>
        </tr>`;
    }
  }


  //Gráfico consumo em tempo real
  const chart = Highcharts.chart('container', {

    chart: {
      type: 'gauge',
      plotBackgroundColor: null,
      plotBackgroundImage: null,
      plotBorderWidth: 0,
      plotShadow: false,
      height: '40%'
    },

    title: {

    },

    legend: { enabled: false },

    pane: {
      startAngle: -90,
      endAngle: 89.9,
      background: null,
      center: ['50%', '75%'],
      size: '110%'
    },

    yAxis: {
      min: 0,
      max: 200,
      tickPixelInterval: 100,
      tickPosition: 'inside',
      tickColor: 'var(--highcharts-background-color, #FFFFFF)',
      tickLength: 20,
      tickWidth: 2,
      minorTickInterval: null,
      labels: {
        distance: 20,
        style: {
          fontSize: '14px'
        }
      },
      lineWidth: 0,
      plotBands: [{
        from: 0,
        to: 120,
        color: '#55BF3B', // verde
        thickness: 20,
        borderRadius: '50%'
      }, {
        from: 120,
        to: 160,
        color: '#DDDF0D', // amarelo
        thickness: 20,
        borderRadius: '50%'
      }, {
        from: 160,
        to: 200,
        color: '#DF5353', // vermelho
        thickness: 20,
        borderRadius: '50%'
      }]
    },

    series: [{
      name: 'Speed',
      data: [0],
      tooltip: {
        valueSuffix: ' km/h'
      },
      dataLabels: {
        format: '{y} km/h',
        borderWidth: 0,
        color: (
          Highcharts.defaultOptions.title &&
          Highcharts.defaultOptions.title.style &&
          Highcharts.defaultOptions.title.style.color
        ) || '#000000',
        style: {
          fontSize: '16px'
        }
      },
      dial: {
        radius: '80%',
        backgroundColor: 'gray',
        baseWidth: 12,
        baseLength: '0%',
        rearLength: '0%'
      },
      pivot: {
        backgroundColor: 'gray',
        radius: 6
      }
    }]

  });

  // Valor do Ponteiro
  async function atualizarPonteiro() {
    const idEmpresa = sessionStorage.FK_EMPRESA;
    const maquina = document.getElementById("filtroMaquina").value.toLowerCase();

    try {
      const response = await fetch(`/sustentabilidade/atual/${idEmpresa}/${maquina}`);
      const data = await response.json();
      const newVal = Number(data[0].potencia);

      // Atualiza o ponteiro
      const point = chart.series[0].points[0];

      point.update(newVal);
      console.log("Recebido da API:", data);
      console.log("Valor calculado:", newVal);
      console.log("Ponteiro atual:", chart.series[0].points[0].y);
    } catch (err) {
      console.error('Erro ao atualizar ponteiro:', err);
    }

  }
  atualizarPonteiro()
  document.getElementById("filtroMaquina").addEventListener('change', atualizarPonteiro);


  document.addEventListener("DOMContentLoaded", () => {
    carregarKPIS();
    atualizarPonteiro();
    // carregarConsumoMensal();
    // MaiorConsumo();
    // emissaoPoluentes();

    // setInterval(carregarKPIS, 15000);
    // setInterval(carregarConsumoMensal, 60000);
    // setInterval(MaiorConsumo, 60000);
    // setInterval(emissaoPoluentes, 60000);
  });

  const btnNotificacao = document.querySelector('.btn-notificacao');
  const modal = document.getElementById('modalNotificacoes');
  const btnFecharModal = document.getElementById('btnFecharModal');
  const alertasContainer = document.getElementById('alertasContainer');

  btnNotificacao.addEventListener('click', () => {
    modal.classList.add('active');
    carregarAlertas();
  });

  btnFecharModal.addEventListener('click', () => modal.classList.remove('active'));

  // Fecha ao clicar fora da caixa
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('active');
  });





  // Código Padrão
  async function carregarAlertas() {
    alertasContainer.innerHTML = "<p class='loading'>Carregando alertas...</p>";

    try {
      const resposta = await fetch("/usuarios/puxarAlerta");
      if (!resposta.ok) throw new Error("Erro ao buscar alertas do servidor.");

      const alertas = await resposta.json();
      alertasContainer.innerHTML = "";

      if (alertas.length == 0) {
        alertasContainer.innerHTML = "<p class='text-muted text-center'>Nenhum alerta encontrado.</p>";
        return;
      }

      alertas.forEach(alerta => {
        let tipoClasse = "";
        switch (alerta.estado) {
          case "CRITICO":
            tipoClasse = "danger";
            break;
          case "ALERTA":
            tipoClasse = "warning";
            break;
          case "NORMAL":
            tipoClasse = "success";
            break;
          default:
            tipoClasse = "success";
        }

        const dataFormatada = new Date(alerta.dtHora).toLocaleString("pt-BR");


        const div = document.createElement("div");
        div.className = `alerta-item ${tipoClasse}`;
        div.innerHTML = `
              <strong>Identificador da máquina:</strong> <small>${alerta.identificador || "Desconhecida"}</small><br>
              <strong>${alerta.componenteNome || "Componente"}:</strong> ${alerta.captura || "Sem dados."}<br>
              <strong>Estado:</strong> <small>${alerta.estado || "DESCONHECIDO"}</small><br>
              <small>${new Date(alerta.dtHora).toLocaleString("pt-BR")}</small>
          `;

        alertasContainer.appendChild(div);
      });
    } catch (error) {
      console.error("Erro ao carregar alertas:", error);
      alertasContainer.innerHTML = `<p class="text-danger text-center">Erro ao carregar alertas.</p>`;
    }
  }


  function formatarData(dataISO) {
    if (!dataISO) return "—";  // filtra para ver se tem o dado ou não
    const data = new Date(dataISO);
    if (isNaN(data)) return "—";  // filtra para ver se tem o dado ou não
    return data.toLocaleString("pt-BR", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
    });
  }


</script>
